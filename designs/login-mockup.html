
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Music Search — Login Mockup</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .login-card {
      background: #181818;
      border-radius: 20px;
      padding: 60px 40px;
      max-width: 520px;
      width: 100%;
    }

    h1 { font-size: 36px; }

    p {
      color: #b3b3b3;
      line-height: 1.6;
    }

    button {
      margin-top: 24px;
      background: #1db954;
      color: #121212;
      border: none;
      border-radius: 30px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #b3b3b3;
    }
  </style>
</head>
<body>
  <header>Spotify Music Search</header>

  <main>
    <section class="login-card">
      <h1>Discover Your Next Favorite Song</h1>
      <p>
        Search songs, artists, and albums
        using your Spotify account.
      </p>
      <button type="button" disabled>
        Connect with Spotify
      </button>
      <p>Login button preview — functionality coming soon.</p>
    </section>
  </main>

  <footer>Powered by Spotify Web API</footer>
</body>
</html>
